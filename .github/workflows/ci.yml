name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: 构建与测试
    runs-on: ubuntu-latest

    # 注意：这里刻意不使用 job 级的 defaults.run.working-directory，
    # 因为本 job 同时包含前端与 Go 步骤，全局 cwd 会让 go 命令跑错目录。
    # 前端步骤各自声明 working-directory。

    steps:
      - uses: actions/checkout@v4

      # 根包 main.go 导入 Wails v3 的 application 包，其 Linux 后端需要 GTK4 /
      # WebKitGTK 的原生库，否则 go vet / go test 会在 pkg-config 阶段失败
      # （Package 'gtk4' was not found in the pkg-config search path）。
      # 依赖清单与版本断言取自 build/docker/Dockerfile.cross；GTK >= 4.14 是
      # Wails 默认 Linux 后端的硬要求，ubuntu-latest（24.04）提供 4.14.5。
      - name: 安装 Wails 的 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libc6-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev
          pkg-config --atleast-version=4.14 gtk4
          pkg-config --exists webkitgtk-6.0
          pkg-config --exists gtk+-3.0
          pkg-config --exists webkit2gtk-4.1

      # main.go 用 //go:embed all:frontend/dist 把前端产物编进二进制。
      # frontend/dist 被 .gitignore 忽略，全新克隆中并不存在，因此必须先构建前端，
      # 否则 go vet / go test / go build 都会报 "pattern all:frontend/dist: no matching files"。
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 前端类型检查
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 前端生产构建
        working-directory: frontend
        run: npm run build

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 下载 Go 依赖
        run: go mod download

      # 只检查 internal/ 与根包：build/ 下是各平台的 Wails 打包脚手架，
      # 带 //go:build ios 等标签，本地存在但被 .gitignore 忽略，CI 中不参与构建。
      - name: go vet
        run: go vet ./internal/... .

      - name: go test
        run: go test ./internal/... .
