name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Go 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 下载依赖
        run: go mod download

      # 只检查 internal/ 与根包：build/ 下是各平台的 Wails 打包脚手架，
      # 本地存在但被 .gitignore 忽略，CI 中不参与构建。
      - name: go vet
        run: go vet ./internal/... .

      - name: go test
        run: go test ./internal/... .

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 生产构建
        run: npm run build
