name: Release

# 打 tag（如 v0.1.0）时触发，构建各平台安装包并发布到 GitHub Release。
#
# 版本号来源：build/config.yml 的 info.version。它会被写入 macOS 的
# Info.plist、Windows 的 info.json 与 Linux 的 nfpm.yaml，因此升级版本时
# 需同步修改该文件（tag 名与之一致，如 v0.1.0）。

on:
  push:
    tags:
      - "v*"
  # 手动触发用于验证构建链路：只构建上传 artifact，不创建 Release
  # （发布步骤仅在 tag 触发时执行）。
  workflow_dispatch:

permissions:
  contents: write # 创建 Release 并上传产物

jobs:
  # macOS：在 Apple 芯片 runner 上构建 arm64 + amd64 通用二进制，产出 .dmg
  # 不签名公证：未持有 Apple Developer 证书，用户首次打开需右键「打开」。
  macos:
    name: macOS (.dmg)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 直接下载固定版本的 tar.gz，不用 arduino/setup-task 也不用官方 install.sh：
      # 两者都要访问 GitHub API 解析版本号，在 CI 共享出口 IP 上会撞速率限制
      # （实测 arduino/setup-task 报 "API rate limit exceeded"）。固定版本并直连
      # release 下载地址可完全避开该问题。
      - name: 安装 Task
        run: |
          set -e
          TASK_VERSION=3.53.1
          curl -sSL -o /tmp/task.tar.gz \
            "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_darwin_arm64.tar.gz"
          tar -xzf /tmp/task.tar.gz -C /tmp task
          sudo install -m 755 /tmp/task /usr/local/bin/task
          task --version

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12

      # 必须用 package:dmg:universal，不能用 Wails 模板默认的 package:dmg ——
      # 后者依赖 `package` → `build`，只构建宿主架构（Apple 芯片 runner 上即
      # arm64-only），Intel Mac 用户无法运行。
      - name: 构建通用二进制并打包为 dmg
        run: wails3 task darwin:package:dmg:universal

      - name: 生成校验和
        run: shasum -a 256 bin/*.dmg > bin/checksums-macos.txt && cat bin/checksums-macos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            bin/*.dmg
            bin/checksums-macos.txt

  # Windows：原生构建 exe 并用 NSIS 打出安装程序
  windows:
    name: Windows (installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Task 官方没有提供 install.ps1（taskfile.dev/install.ps1 返回 404），
      # 因此直接下载 Windows 版 zip 解压。固定版本号以免依赖 GitHub API 解析
      # 最新 release（CI 共享 IP 上会撞速率限制）。
      - name: 安装 Task
        shell: pwsh
        run: |
          $version = "3.53.1"
          $url = "https://github.com/go-task/task/releases/download/v$version/task_windows_amd64.zip"
          New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\bin" | Out-Null
          Invoke-WebRequest -Uri $url -OutFile task.zip
          Expand-Archive -Path task.zip -DestinationPath "$env:USERPROFILE\bin" -Force
          echo "$env:USERPROFILE\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$env:USERPROFILE\bin\task.exe" --version

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12

      # choco 装的 NSIS 不一定在 PATH 上（实测报
      # "makensis: executable file not found in $PATH"），因此显式定位并加入 PATH。
      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis --yes
          $dir = Get-ChildItem "C:\Program Files (x86)\NSIS","C:\Program Files\NSIS" -ErrorAction SilentlyContinue |
                 Select-Object -First 1 -ExpandProperty FullName
          if (-not $dir) { throw "未找到 NSIS 安装目录" }
          Write-Host "NSIS 目录: $dir"
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\makensis.exe" /VERSION

      - name: 构建并打包为安装程序
        run: wails3 task windows:package

      - name: 生成校验和
        shell: pwsh
        run: |
          Get-ChildItem bin\*.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding utf8 bin\checksums-windows.txt
          Get-Content bin\checksums-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            bin/*.exe
            bin/checksums-windows.txt

  # Linux：在目标发行版上原生构建（CGO 需要 GTK4 / WebKitGTK），
  # 用 nfpm 打包 .deb 与 .rpm。Ubuntu 24.04 提供 GTK 4.14.5，
  # 满足 Wails Linux 后端 GTK >= 4.14 的要求。
  linux-x64:
    name: Linux x64 (deb / rpm)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 同 macOS：固定版本直连下载，避开 GitHub API 速率限制
      - name: 安装 Task
        run: |
          set -e
          TASK_VERSION=3.53.1
          curl -sSL -o /tmp/task.tar.gz \
            "https://github.com/go-task/task/releases/download/v${TASK_VERSION}/task_linux_amd64.tar.gz"
          tar -xzf /tmp/task.tar.gz -C /tmp task
          sudo install -m 755 /tmp/task /usr/local/bin/task
          task --version

      # 系统依赖必须在安装 Wails CLI 之前装好：`go install wails3` 会编译 Wails
      # 自身的 GTK 绑定，缺少这些库时安装阶段就会失败
      # （实测报 /usr/bin/ld: cannot find -lgraphene-1.0 / -lsoup-3.0 / -lglib-2.0），
      # 且失败会使后续的构建步骤被跳过。
      - name: 安装构建与打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config gcc libc6-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libgtk-4-dev libwebkitgtk-6.0-dev
          pkg-config --atleast-version=4.14 gtk4
          pkg-config --exists webkitgtk-6.0

      - name: 安装 Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12

      - name: 构建并打包 deb / rpm
        env:
          # nfpm.yaml 用这两个变量填 maintainer 字段，需显式提供
          GIT_COMMITTER_NAME: dongying1997
          GIT_COMMITTER_EMAIL: 130125674+dongying1997@users.noreply.github.com
        run: wails3 task linux:package

      - name: 生成校验和
        run: sha256sum bin/*.deb bin/*.rpm > bin/checksums-linux-x64.txt && cat bin/checksums-linux-x64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-packages
          path: |
            bin/*.deb
            bin/*.rpm
            bin/checksums-linux-x64.txt

  # 将各平台产物汇总到一个 Release
  publish:
    name: 发布 Release
    needs: [macos, windows, linux-x64]
    # 手动触发时只验证构建，不发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 统一重命名并生成一份汇总校验和。
      # 注意本步骤在 `set -e` 下运行，且某些平台可能无产物（空 glob），
      # 因此所有重命名都必须带 || true，否则会误判为失败。
      - name: 整理产物并生成校验和
        run: |
          set -e
          cd artifacts
          shopt -s nullglob

          # 各平台单独计算的校验和丢弃，改由最终产物统一生成
          rm -f checksums-*.txt

          # 删掉 NSIS 安装程序的构建输入（裸 exe），只发布安装程序本身，
          # 否则用户会看到两个 Windows 文件而不知该下哪个
          rm -f materialcost4.exe

          # 把平台标识写进文件名，避免用户拿到一堆同名文件分不清来源
          rename_if() { [ -f "$1" ] && mv "$1" "$2" || true; }
          rename_if materialcost4.dmg                 materialcost4-macos-universal.dmg
          rename_if materialcost4-amd64-installer.exe materialcost4-windows-amd64-setup.exe
          for f in *.deb; do mv "$f" "materialcost4-linux-amd64.deb"; done
          for f in *.rpm; do mv "$f" "materialcost4-linux-x86_64.rpm"; done

          sha256sum materialcost4-* > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 安装说明

            | 平台 | 文件 |
            |------|------|
            | macOS（Intel + Apple 芯片通用） | `materialcost4-macos-universal.dmg` |
            | Windows (x64) | `materialcost4-windows-amd64-setup.exe` |
            | Linux (Debian / Ubuntu) | `materialcost4-linux-amd64.deb` |
            | Linux (Fedora / RHEL) | `materialcost4-linux-x86_64.rpm` |

            安装包均**未做代码签名**：

            - **macOS**：首次打开需右键点击应用选「打开」，或在「系统设置 → 隐私与安全性」中放行。
            - **Windows**：SmartScreen 可能提示「Windows 已保护你的电脑」，点「更多信息 → 仍要运行」。
            - **Linux**：deb / rpm 已声明 GTK4 与 WebKitGTK 依赖，由包管理器自动安装。

            校验和见 `SHA256SUMS.txt`。

            > 数据存放于系统用户数据目录（macOS 为 `~/Library/Application Support/MaterialCost4/`），
            > 升级或重装不会丢失。
