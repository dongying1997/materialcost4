name: probe
on: push:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: GTK 版本探测
        run: |
          echo "=== OS ==="; cat /etc/os-release | head -3
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev > /dev/null
          echo "=== pkg-config 结果 ==="
          echo "gtk4:          $(pkg-config --modversion gtk4 2>&1)"
          echo "webkitgtk-6.0: $(pkg-config --modversion webkitgtk-6.0 2>&1)"
          echo "=== 官方 Dockerfile 的断言 ==="
          pkg-config --atleast-version=4.14 gtk4 && echo "gtk4 >= 4.14 PASS" || echo "gtk4 >= 4.14 FAIL"
          pkg-config --exists webkitgtk-6.0 && echo "webkitgtk-6.0 exists PASS" || echo "webkitgtk-6.0 exists FAIL"
