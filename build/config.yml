# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run `wails3 task common:update:build-assets` to update the assets.
# Note that this will overwrite any changes you have made to the assets.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "dongying1997" # The name of the company
  productName: "MaterialCost" # The name of the application
  productIdentifier: "io.github.dongying1997.materialcost4" # The unique product identifier
  description: "化学反应的物料成本计算工具" # The application description
  copyright: "(c) 2026, dongying1997" # Copyright text
  comments: "基于 Wails v3 + React 的化学物料成本计算桌面应用" # Comments
  version: "0.2.1" # The application version
  # cfBundleIconName: "appicon" # The macOS icon name in Assets.car icon bundles (optional)
  #                               # Should match the name of your .icon file without the extension
  #                               # If not set and Assets.car exists, defaults to "appicon"

# iOS build configuration (uncomment to customise iOS project generation)
# Note: Keys under `ios` OVERRIDE values under `info` when set.
# ios:
#   # The iOS bundle identifier used in the generated Xcode project (CFBundleIdentifier)
#   bundleID: "com.mycompany.myproduct"
#   # The display name shown under the app icon (CFBundleDisplayName/CFBundleName)
#   displayName: "My Product"
#   # The app version to embed in Info.plist (CFBundleShortVersionString/CFBundleVersion)
#   version: "0.1.0"
#   # The company/organisation name for templates and project settings
#   company: "My Company"
#   # Additional comments to embed in Info.plist metadata
#   comments: "基于 Wails v3 + React 的化学物料成本计算桌面应用"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    # The frontend dev server must be registered BEFORE the blocking build:
    # the refresh engine runs steps in list order, so a background step placed
    # after the build does not start until the build finishes - and the build
    # plus `task run` then races vite to the port. When that race is lost the
    # app exhausts its 10 x 500ms retries before vite has even printed "ready"
    # and dies with "unable to connect to frontend server".
    # Registering it first also means it starts once and survives reloads, so
    # it is never re-spawned behind the blocking build (which would orphan the
    # previous vite and make the new one fail with EADDRINUSE under strictPort).
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 build DEV=true
      type: blocking
      # Give vite time to bind the port. `wails3 task run` only waits 10 x 500ms
      # and the first `task` invocation needs ~6s just to run `npm install`,
      # so without this the backend can still arrive before the server is up.
      delay_next: 1000
    - cmd: wails3 task run
      type: primary

